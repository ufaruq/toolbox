name: Semgrep
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 4 * * 2'
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan with Semgrep Community Edition (no account required)
        run: |
          make semgrep-check SEMGREP_REPORT_DIR="$RUNNER_TEMP/semgrep"
      - uses: github/codeql-action/upload-sarif@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        if: always()
        with:
          sarif_file: ${{ runner.temp }}/semgrep/semgrep.sarif
          category: semgrep-ce
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-results
          path: ${{ runner.temp }}/semgrep/semgrep.sarif
          retention-days: 14
