name: Gitleaks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '40 6 * * 1'
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full Git history (redacted)
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/gitleaks:/reports" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --report-format json --report-path /reports/gitleaks.json --log-opts="--all" .
      - name: Preserve redacted findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-redacted
          path: ${{ runner.temp }}/gitleaks/gitleaks.json
          retention-days: 14
