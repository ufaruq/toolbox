name: Claude Review
on:
  pull_request:
    branches: [main]
    # Once per PR (not every push) to save subscription usage.
    # Add `synchronize` to review every push.
    types: [opened, reopened, ready_for_review]
jobs:
  review:
    # Skip drafts and fork PRs (forks can't read repo secrets).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on:
            - Bugs and correctness
            - Security (secrets handling, auth, input validation)
            - Concurrency and race conditions
            - Missing or weak tests

            The PR branch is already checked out.
            Use `gh pr comment` for a short top-level summary.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for specific issues.
            Only post GitHub comments; don't submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
