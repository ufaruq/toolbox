name: Go
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mcp-gateway-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Pull pinned MCP pilot images
        run: |
          docker pull docker/mcp-gateway@sha256:b0a3876ffbb352813d658cf25c137b8eae29bbe23db5944560a1c9059533bb16
          docker pull ghcr.io/github/github-mcp-server@sha256:250bc6ce70788207608ef74cef4397230ff2e8481218da74d6093e4bd9101132
      - name: Real gateway and official server with isolated synthetic credentials
        shell: bash
        run: make mcp-gateway-check 2>&1 | tee /tmp/toolbox-mcp-gateway-e2e.log
      - name: Upload MCP pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-gateway-pilot
          path: /tmp/toolbox-mcp-gateway-e2e.log
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Start disposable integration stores
        run: |
          docker compose -p toolbox-ci up -d --wait
          docker compose -p toolbox-ci exec -T postgres createdb -U toolbox toolbox_test
          docker compose -p toolbox-ci exec -T openbao bao write secret/config cas_required=true max_versions=3
      - name: Race and integration tests
        env:
          TOOLBOX_TEST_DATABASE_URL: postgres://toolbox:fixture-only@127.0.0.1:5432/toolbox_test?sslmode=disable&application_name=toolbox-lock-test
          TOOLBOX_TEST_OPENBAO_ADDR: http://127.0.0.1:8200
          TOOLBOX_TEST_OPENBAO_TOKEN: fixture-only
        run: go test -race -count=1 ./...
      - run: go build ./...
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Synthetic OIDC owner browser flow
        env:
          TOOLBOX_TEST_OIDC_BROWSER: '1'
          TOOLBOX_BROWSER_ARTIFACT_DIR: /tmp/toolbox-browser-artifacts
          TOOLBOX_E2E_REVISION: ${{ github.sha }}
        run: go test -race -count=1 ./internal/server -run '^TestOIDCBrowserFlow$'
      - name: Synthetic Workspace and Google probe browser flows
        env:
          TOOLBOX_TEST_WORKSPACE_BROWSER: '1'
          TOOLBOX_BROWSER_ARTIFACT_DIR: /tmp/toolbox-browser-artifacts
        run: go test -race -count=1 ./internal/app ./cmd/toolbox -run 'Test(Workspace|Probe)BrowserFlow'
      - name: Start fixture service for browser tests
        env:
          TOOLBOX_MODE: fixture
          TOOLBOX_ADDR: 127.0.0.1:18080
          DATABASE_URL: postgres://toolbox:fixture-only@127.0.0.1:5432/toolbox?sslmode=disable
          OPENBAO_ADDR: http://127.0.0.1:8200
          OPENBAO_TOKEN: fixture-only
        run: |
          go build -o /tmp/toolbox-ci ./cmd/toolbox
          nohup /tmp/toolbox-ci > /tmp/toolbox-ci.log 2>&1 &
          echo $! > /tmp/toolbox-ci.pid
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18080/readyz', timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  pass
              time.sleep(0.5)
          else:
              raise SystemExit('Fixture service did not become ready')
          PY
      - name: Browser approval, revocation and delayed review flows
        env:
          TOOLBOX_BROWSER_ARTIFACT_DIR: /tmp/toolbox-browser-artifacts
          TOOLBOX_E2E_REVISION: ${{ github.sha }}
        run: |
          python tests/browser/fixture_e2e.py
          python tests/browser/review_race.py
      - name: Upload browser screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e
          path: |
            /tmp/toolbox-browser-artifacts
            /tmp/toolbox-ci.log
      - name: Stop integration stores
        if: always()
        run: |
          if [ -f /tmp/toolbox-ci.pid ]; then kill "$(cat /tmp/toolbox-ci.pid)" || true; fi
          docker compose -p toolbox-ci down
