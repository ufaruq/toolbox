name: Trivy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '40 6 * * 1'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan dependencies, secrets and infrastructure configuration
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/trivy:/reports" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 \
            --format sarif --output /reports/trivy.sarif /src
      - uses: github/codeql-action/upload-sarif@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        if: always()
        with:
          sarif_file: ${{ runner.temp }}/trivy/trivy.sarif
          category: trivy-source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-source
          path: ${{ runner.temp }}/trivy/trivy.sarif
          retention-days: 14
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - toolbox-postgres:17.11-hardened
          - openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
          - quay.io/keycloak/keycloak@sha256:3879c623248408de29a5303178b5816c77e8dfef3890c361f8c0bbeaa979ba3b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and export hardened PostgreSQL fixture
        if: matrix.image == 'toolbox-postgres:17.11-hardened'
        run: |
          docker build -t toolbox-postgres:17.11-hardened -f deploy/postgres/Dockerfile .
          docker save -o "$RUNNER_TEMP/postgres.tar" toolbox-postgres:17.11-hardened
      - name: Scan runtime image
        env:
          SCAN_IMAGE: ${{ matrix.image }}
        run: |
          if [ "$SCAN_IMAGE" = toolbox-postgres:17.11-hardened ]; then
            docker run --rm -v "$RUNNER_TEMP/postgres.tar:/image.tar:ro" \
              aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --input /image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1
            exit 0
          fi
          docker run --rm \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --image-src remote --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$SCAN_IMAGE"
