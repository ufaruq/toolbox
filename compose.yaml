# Disposable local dependencies only. Run the Go fixture service on the host.
# No real OAuth credentials or real documents belong in this stack.
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: toolbox
      POSTGRES_PASSWORD: fixture-only
      POSTGRES_DB: toolbox
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolbox -d toolbox"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
  openbao:
    image: openbao/openbao:2.4.1
    command: server -dev -dev-root-token-id=fixture-only -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_TOKEN: fixture-only
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 2s
      timeout: 2s
      retries: 20
