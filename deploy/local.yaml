    environment: *local
    volumes: [../.deploy/secrets/local-root:/run/toolbox/local-root:ro]
  cleanup:
    environment: *local
    volumes: [../.deploy/secrets/local-root:/run/toolbox/local-root:ro]
  retention:
    environment: *local
    volumes: [../.deploy/secrets/local-root:/run/toolbox/local-root:ro]
